# Integração e publicação contínuas.
#  - Em qualquer branch/PR: lint, tipos e build (nada quebrado chega à produção).
#  - Em push na main: atualiza a release "producao" com o pacote do site.
#    O servidor (deploy/boot.mjs, via Docker) verifica essa release a cada 5 minutos
#    e coloca a nova versão no ar sozinho, com reversão automática se ela não responder.
#  - Opcional: deploy por SSH direto num VPS (job "deploy-ssh"), se os secrets VPS_* existirem.

name: CI / Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 22.04 (glibc 2.35) mantém o módulo nativo do SQLite compatível com Ubuntu 22.04 e 24.04 no servidor
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://lab81studio.com.br' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          STORAGE_DIR: ${{ runner.temp }}/build-storage
      - name: Empacotar release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp deploy/remote-deploy.sh .next/standalone/
          tar -C .next/standalone -czf release.tgz .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release
          path: release.tgz
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Atualizar release "producao"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTE="Versão ${GITHUB_SHA::7} — $(date -u +%Y-%m-%dT%H:%MZ)"
          if gh release view producao >/dev/null 2>&1; then
            gh release edit producao --notes "$NOTE" --target "$GITHUB_SHA"
            gh release upload producao release.tgz --clobber
          else
            gh release create producao release.tgz --title "Produção" --notes "$NOTE" --target "$GITHUB_SHA" --latest
          fi

  deploy-ssh:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Verificar configuração do servidor
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Secrets do VPS não configurados: build validado, publicação ignorada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: release
      - name: Publicar
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER || 'lab81' }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/id_deploy -P "$PORT" release.tgz "$USER@$HOST:/srv/lab81/releases/$RELEASE.tgz"
          $SSH "$USER@$HOST" "mkdir -p /srv/lab81/releases/$RELEASE && tar -xzf /srv/lab81/releases/$RELEASE.tgz -C /srv/lab81/releases/$RELEASE && rm /srv/lab81/releases/$RELEASE.tgz && bash /srv/lab81/releases/$RELEASE/remote-deploy.sh $RELEASE"
