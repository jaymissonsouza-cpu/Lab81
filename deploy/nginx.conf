# /etc/nginx/sites-available/lab81  →  ln -s ../sites-available/lab81 /etc/nginx/sites-enabled/
# HTTPS com Certbot:  sudo certbot --nginx -d lab81.com.br -d www.lab81.com.br

server {
    listen 80;
    server_name lab81.com.br www.lab81.com.br;
    return 301 https://www.lab81.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lab81.com.br;
    # ssl_certificate / ssl_certificate_key gerenciados pelo Certbot
    return 301 https://www.lab81.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.lab81.com.br;
    # ssl_certificate / ssl_certificate_key gerenciados pelo Certbot

    # Uploads do orçamento: limite total do formulário (150 MB) + margem
    client_max_body_size 160m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Assets imutáveis do Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
